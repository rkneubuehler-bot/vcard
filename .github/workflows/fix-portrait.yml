name: Fix portrait image

on:
  push:
    paths:
      - 'portrait-base64-upload.txt'

permissions:
  contents: write

jobs:
  fix-portrait:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode portrait
        run: base64 --decode portrait-base64-upload.txt > portrait.jpg

      - name: Verify JPEG
        run: |
          file portrait.jpg
          python - <<'PY'
          from PIL import Image
          img = Image.open('portrait.jpg')
          img.verify()
          print('JPEG valid')
          PY

      - name: Commit fixed portrait
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portrait.jpg
          if git diff --cached --quiet; then
            echo 'No portrait change needed.'
          else
            git commit -m 'Fix portrait image file'
            git push
          fi
